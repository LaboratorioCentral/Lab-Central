<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio Central · Hospital Gutiérrez</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --teal-dark: #0a5a63;
  --teal: #0e7c86;
  --teal-light: #e4f3f3;
  --navy: #163a4a;
  --gray-text: #5b6b6a;
  --border-soft: #dce8e8;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:
    radial-gradient(circle at 15% 0%, #d7eeee 0%, transparent 55%),
    radial-gradient(circle at 100% 20%, #eaf6e9 0%, transparent 45%),
    linear-gradient(160deg, #f4fafa 0%, #eef5f6 60%, #e9f2f1 100%);
  background-attachment: fixed;
  padding: 32px 16px;
  margin: 0;
  min-height: 100vh;
}

.container {
  max-width: 620px;
  margin: auto;
  background: #ffffff;
  padding: 28px 28px 32px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(10, 58, 66, 0.1);
  border-top: 6px solid var(--teal);
}

.encabezado {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-soft);
}

.encabezado img {
  width: 58px;
  height: 58px;
  object-fit: contain;
  flex-shrink: 0;
}

.encabezado-texto h1 {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--navy);
  margin: 0 0 2px;
  line-height: 1.25;
}

.encabezado-texto .marca {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--teal);
  text-transform: uppercase;
  margin: 0 0 4px;
}

.encabezado-texto .subtitulo {
  font-size: 0.85rem;
  color: var(--gray-text);
  margin: 0;
}

label.etiqueta-buscador {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 13px 16px;
  border: 1.5px solid #c9dadb;
  border-radius: 10px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
  font-size: 16px;
  margin-bottom: 12px;
  background: #fbfdfd;
}

input:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(14, 124, 134, 0.15);
}

.botones {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  flex: 1;
  min-width: 120px;
  padding: 12px 15px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
}

button:active {
  transform: scale(0.97);
}

button.buscar {
  background-color: var(--teal);
  color: white;
  box-shadow: 0 4px 10px rgba(14, 124, 134, 0.25);
}

button.buscar:hover {
  background-color: var(--teal-dark);
}

button.borrar {
  background-color: #ffffff;
  color: var(--gray-text);
  border: 1.5px solid #d6dede;
}

button.borrar:hover {
  background-color: #f3f6f6;
  color: var(--navy);
}

.resultado {
  margin-top: 6px;
}

.item {
  background: #fafdfd;
  padding: 18px 20px;
  margin-top: 16px;
  border-left: 6px solid var(--teal);
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(10, 58, 66, 0.06);
}

.item .nombre {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.item .nombre strong {
  font-size: 1.02rem;
  color: var(--navy);
}

.tag-categoria {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: white;
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

.item .campo {
  margin-top: 8px;
  font-size: 0.93rem;
  line-height: 1.45;
  color: #2d3e3e;
}

.item .campo strong {
  color: var(--navy);
}

.tubos {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 10px;
  margin-top: 6px;
}

.tubo {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 64px;
  text-align: center;
}

.tubo svg {
  width: 20px;
  height: 46px;
}

.tubo .etq {
  font-size: 0.66rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.12;
  margin-top: 3px;
}

.tubo .sub {
  font-size: 0.6rem;
  color: var(--gray-text);
  line-height: 1.12;
}

.tubo .segunda {
  font-size: 0.62rem;
  font-weight: 800;
  color: #a6400a;
  background: #fff0e0;
  border-radius: 6px;
  padding: 1px 6px;
  margin-top: 3px;
}

.leyenda-tubos {
  font-size: 0.78rem;
  color: var(--gray-text);
  margin-top: 8px;
}

.item .sinonimos {
  font-size: 0.78rem;
  color: #7a8b8a;
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-soft);
}

.alertas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 2px 0 6px;
}

.alerta {
  font-size: 0.78rem;
  font-weight: 800;
  padding: 5px 10px;
  border-radius: 8px;
  border: 1.5px solid;
  line-height: 1.2;
}

.alerta.urgente   { background: #fdecea; border-color: #d93025; color: #a31d14; }
.alerta.importante { background: #fff4e0; border-color: #e8890c; color: #8a4b00; }
.alerta.requisito { background: #e8f1fb; border-color: #2f6fb5; color: #1b4a80; }
.alerta.guardia   { background: #e6f6ec; border-color: #1e8e4e; color: #14683a; }

.aviso-aprox {
  margin-top: 16px;
  padding: 12px 14px;
  background: #eef6ff;
  border-left: 6px solid #2f6fb5;
  border-radius: 10px;
  font-size: 0.9rem;
  color: #1b4a80;
}

.sin-resultados {
  margin-top: 18px;
  padding: 16px;
  background: #fdf3ec;
  border-left: 6px solid #e07a3f;
  border-radius: 12px;
  color: #6b4a2f;
  font-size: 0.93rem;
}

#fecha-actualizacion {
  font-size: 11px;
  color: #93a3a2;
  text-align: center;
  margin-top: 26px;
}

@media (max-width: 600px) {
  body {
    padding: 18px 10px;
  }
  .container {
    padding: 20px 18px 26px;
  }
  .encabezado img {
    width: 48px;
    height: 48px;
  }
  .encabezado-texto h1 {
    font-size: 0.92rem;
  }
}
  
.sec{border:1.5px solid var(--border-soft);border-radius:12px;margin-top:10px;background:#fff;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;font-weight:800;color:var(--navy);background:#f6fbfb;font-size:.98rem}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{font-weight:700;font-size:.78rem;color:var(--gray-text);white-space:nowrap}
.sec>summary .n::after{content:" ▸";}
.sec[open]>summary .n::after{content:" ▾";}
.sec .lista{padding:2px 12px 10px;border-top:1px solid var(--border-soft)}
.det{border-bottom:1px dashed #e3eded}
.det:last-child{border-bottom:0}
.det>summary{list-style:none;cursor:pointer;padding:11px 4px;color:var(--navy);font-size:.92rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.det>summary::-webkit-details-marker{display:none}
.det>summary::after{content:"+";font-weight:800;color:var(--teal);font-size:1.1rem}
.det[open]>summary::after{content:"–"}
.det>summary .ficha-mini{font-size:.62rem;font-weight:800;color:#a6400a;background:#fff0e0;border-radius:6px;padding:2px 6px;margin-left:6px;white-space:nowrap}
.det .item{margin-top:4px;margin-bottom:10px}
.sec-nota{font-size:.78rem;color:var(--gray-text);padding:10px 4px 2px}
.titulo-seccion{font-size:.72rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--gray-text);margin:22px 0 4px}
.alerta-ficha{background:#fff0e0;border:1.5px solid #e8590c;color:#a6400a;font-weight:800;font-size:.85rem;padding:9px 12px;border-radius:8px;margin:4px 0 6px}
.item.con-ficha{border-left-color:#e8590c !important}
.perfil{border-left-color:var(--acento2,#1f6f8b)}
.perfil .incluye{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.perfil .comp{font-size:.82rem;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--chip-bg,#e8f4f8);color:var(--chip-fg,#14566e);border:1px solid var(--chip-bd,#bfe0ea)}
.perfil .comp.nolista{background:#f1f3f3;color:#6b7b7a;border-color:#dde4e4;font-weight:600}
.perfil .pie{font-size:.74rem;color:var(--gray-text);margin-top:8px}
.incluye-det{margin-top:8px;font-size:.88rem}
.incluye-det .comp{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--chip-bg,#e8f4f8);color:var(--chip-fg,#14566e);margin:3px 4px 0 0}
.ver-fichas>summary{cursor:pointer;font-weight:700;color:var(--teal);font-size:.88rem;margin-top:12px;list-style:none}
.ver-fichas>summary::-webkit-details-marker{display:none}
.ver-fichas>summary::before{content:"▸ "}
.ver-fichas[open]>summary::before{content:"▾ "}
.menu-principal{display:grid;gap:14px;margin-top:4px}
.btn-menu{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px 18px;border-radius:16px;border:1.5px solid var(--border-soft);background:linear-gradient(135deg,#f6fbfb,#e9f5f5);cursor:pointer;box-shadow:0 4px 12px rgba(10,58,66,.07);font-family:inherit}
.btn-menu:hover{border-color:var(--teal)}
.btn-menu .ico{flex:0 0 58px;height:58px;border-radius:14px;background:var(--teal);display:flex;align-items:center;justify-content:center}
.btn-menu.sec2 .ico{background:var(--acento2,#1f6f8b)}
.btn-menu.sec3 .ico{background:#e8590c}
.btn-menu.sec4 .ico{background:#1e8e4e}
.btn-menu .ico svg{width:34px;height:34px}
.btn-menu strong{display:block;font-size:1.08rem;color:var(--navy);letter-spacing:.2px}
.btn-menu span.sub{display:block;font-size:.82rem;color:var(--gray-text);font-weight:500;margin-top:3px}
.volver{display:inline-block;flex:none;min-width:0;width:auto;background:none;border:none;color:var(--teal);font-weight:700;font-size:.92rem;padding:4px 0;margin-bottom:12px;box-shadow:none}
.pdf-card{display:flex;align-items:center;gap:12px;background:#fafdfd;border:1.5px solid var(--border-soft);border-left:5px solid #e8590c;border-radius:10px;padding:10px 12px 10px 14px;margin-top:8px}
.pdf-info{flex:1;min-width:0}
.pdf-card h3{margin:0;font-size:.92rem;line-height:1.3;color:var(--navy)}
.pdf-card .para{margin-top:3px;font-size:.78rem;color:var(--gray-text);line-height:1.5}
.pdf-card .para b{color:var(--navy)}
.btn-pdf{flex-shrink:0;display:inline-block;padding:6px 12px;border-radius:8px;background:var(--teal);color:#fff;font-weight:700;font-size:.78rem;text-decoration:none;white-space:nowrap}
.btn-pdf.off{background:#e3e8ee;color:#7a8794;cursor:default}
.vacio{margin-top:18px;padding:16px;background:#eef6ff;border-left:6px solid #2f6fb5;border-radius:12px;color:#1b4a80;font-size:.93rem}
.alerta.medula{background:#f1eafb;border-color:#8e5bd1;color:#5a2d99}
.vista{display:none}.vista.activa{display:block}
:root{--teal:#0a62b8;--teal-dark:#07477f;--navy:#0f2a47;--gray-text:#5a6b7d;--border-soft:#d9e4f0;--acento2:#19a7ce;--chip-bg:#e6f0fb;--chip-fg:#0a4a8c;--chip-bd:#bcd5f2}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 15% 0%,#d9e8f8 0%,transparent 55%),radial-gradient(circle at 100% 20%,#e3f3f8 0%,transparent 45%),linear-gradient(160deg,#f4f8fc,#eaf1f8);background-attachment:fixed}
.btn-menu{background:linear-gradient(135deg,#f7fafe,#e8f1fb)}
</style>

function resaltar(texto) {
  if (!texto) return "";
  return texto
    .replace(/\bEDTA\b/gi, "<b style='color: purple;'>EDTA</b>")
    .replace(/\bheparina\b/gi, "<b style='color: green;'>heparina</b>")
    .replace(/\bcitrato\b/gi, "<b style='color: #00BFFF;'>citrato</b>")
    .replace(/\bjeringa\b/gi, "💉 jeringa");
}

const TUBOS = {
  seco:     { etq: "Seco / Piedras", sub: "(rojo o blanco)", tapa: ["#d62828", "#ffffff"] },
  gel:      { etq: "Con gel", sub: "(amarillo)", tapa: ["#f4c20d"] },
  heparina: { etq: "Heparina de litio", sub: "(verde)", tapa: ["#2e9e4f"] },
  edta:     { etq: "EDTA", sub: "(lila)", tapa: ["#8e5bd1"] },
  citrato:  { etq: "Citrato de sodio", sub: "(celeste)", tapa: ["#4cc3f1"] }
};

function svgTubo(colores) {
  let tapa;
  if (colores.length === 2) {
    tapa = `<rect x="3" y="2" width="14" height="14" rx="3" fill="${colores[0]}"/>
            <rect x="17" y="2" width="14" height="14" rx="3" fill="${colores[1]}" stroke="#9aa5a5" stroke-width="1"/>`;
  } else {
    tapa = `<rect x="3" y="2" width="28" height="14" rx="3" fill="${colores[0]}"/>`;
  }
  return `<svg viewBox="0 0 34 78" aria-hidden="true">${tapa}
    <path d="M6 16 H28 V62 a11 11 0 0 1 -22 0 Z" fill="#f3fafa" stroke="#7d8f8f" stroke-width="1.6"/>
    <path d="M7 44 H27 V62 a10 10 0 0 1 -20 0 Z" fill="${colores[0]}" opacity="0.28"/></svg>`;
}

function htmlTubos(tubos, tapaNegra, jeringa) {
  const claves = Object.keys(tubos || {});
  if (claves.length === 0 && !jeringa) return "";
  let html = "";
  if (claves.length > 0) {
    html += `<div class="tubos">`;
    claves.forEach(k => {
      const t = TUBOS[k];
      let tapa = t.tapa, sub = t.sub;
      if (k === "citrato" && tapaNegra) { tapa = ["#111111"]; sub = "(tapa negra)"; }
      const segunda = tubos[k] === "segunda" ? `<span class="segunda">2ª opción</span>` : "";
      html += `<div class="tubo">${svgTubo(tapa)}<span class="etq">${t.etq}</span><span class="sub">${sub}</span>${segunda}</div>`;
    });
    html += `</div>`;
  }
  if (jeringa) html += `<div class="campo">💉 Jeringa heparinizada</div>`;
  return html;
}

function mostrar(clave, info, seccion) {
  const esLab = info.tubos !== undefined;
  const color = info.color || "#0e7c86";
  let html = `<div class="item${info.ficha ? " con-ficha" : ""}" style="border-left-color:${color};">
    <div class="nombre"><strong>${seccion === "Virología - Biología Molecular" ? clave.replace(/ - PCR$/, "") : clave}</strong>`;
  if (esLab) html += `<span class="tag-categoria" style="background-color:${color};">${info.categoria}</span>`;
  html += `</div>`;
  if (info.ficha) html += `<div class="alerta-ficha">⚠️ REQUIERE FICHA EPIDEMIOLÓGICA OBLIGATORIA</div>`;
  if (info.alertas && info.alertas.length) {
    html += `<div class="alertas">` + info.alertas.map(a => `<span class="alerta ${a.tipo}">${a.icono} ${a.texto}</span>`).join("") + `</div>`;
  }
  if (info.incluye && info.incluye.length) {
    html += `<div class="incluye-det"><strong>🔬 Incluye:</strong><br>` + info.incluye.map(x => `<span class="comp">${x}</span>`).join("") + `</div>`;
  }
  const tubos = esLab ? htmlTubos(info.tubos, info.tapaNegra, info.jeringa) : "";
  if (tubos || info.muestra) {
    html += `<div class="campo"><strong>🧪 Tipo de muestra:</strong>`;
    if (info.muestra) html += ` ${resaltar(info.muestra)}`;
    html += `${tubos}</div>`;
  }
  if (info.condiciones) html += `<div class="campo"><strong>📋 Observaciones:</strong> ${resaltar(info.condiciones)}</div>`;
  if (info.sector && (!seccion || info.sector !== seccion)) html += `<div class="campo"><strong>📌 Sector:</strong> ${info.sector}</div>`;
  if (info.interno) html += `<div class="campo"><strong>📞 Interno:</strong> ${info.interno}</div>`;
  html += `</div>`;
  return html;
}

function normalizar(t) {
  return (t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
}

function puntaje(clave, info, entrada) {
  const nCompleto = normalizar(clave);
  const n = nCompleto.replace(/ - pcr$/, "");
  if (n === entrada) return 0;
  if (n.startsWith(entrada)) return 1;
  const sins = (info.sinonimos || []).map(normalizar);
  if (sins.includes(entrada)) return 0.5;
  if (entrada.length >= 3) {
    if (sins.some(x => x.startsWith(entrada))) return 2;
    if (nCompleto.includes(entrada)) return 3;
    if (sins.some(x => x.includes(entrada))) return 4;
    const palabras = entrada.split(/\s+/).filter(w => w.length >= 2);
    if (palabras.length > 1) {
      const pajar = nCompleto + " " + sins.join(" ");
      if (palabras.every(w => pajar.includes(w))) return 5;
    }
  } else if (n.includes(entrada)) {
    return 3;
  }
  return null;
}

// ---------- Perfiles ----------
function tubosComunes(p) {
  const con = p.fichas.map(k => datos[k]).filter(i => i && i.tubos && Object.keys(i.tubos).length);
  if (!con.length) return null;
  let comunes = Object.keys(con[0].tubos);
  con.forEach(i => { comunes = comunes.filter(k => k in i.tubos); });
  return comunes;
}

function mostrarPerfil(nombre, p) {
  let html = `<div class="item perfil"><div class="nombre"><strong>${nombre}</strong>
    <span class="tag-categoria" style="background-color:var(--acento2,#1f6f8b);">Perfil</span></div>`;
  html += `<div class="campo"><strong>🔬 Incluye:</strong></div><div class="incluye">` +
    p.items.map(it => `<span class="comp${it.clave ? "" : " nolista"}">${it.texto}</span>`).join("") + `</div>`;
  const comunes = tubosComunes(p);
  if (comunes && comunes.length) {
    const t = {}; comunes.forEach(k => t[k] = "si");
    html += `<div class="campo"><strong>🧪 Tubos que sirven para todo el perfil:</strong>${htmlTubos(t, false, false)}</div>`;
    html += `<div class="campo" style="font-size:.8rem;color:var(--gray-text)">Alcanza con uno de ellos.</div>`;
  } else if (comunes) {
    html += `<div class="campo">🧪 Las determinaciones del perfil usan tubos distintos: ver cada ficha.</div>`;
  }
  if (p.items.some(it => !it.clave)) {
    html += `<div class="pie">Los ítems en gris no figuran como determinación individual en el menú.</div>`;
  }
  if (p.fichas.length) {
    html += `<details class="ver-fichas"><summary>Ver fichas de las determinaciones (${p.fichas.length})</summary>` +
      p.fichas.map(k => mostrar(k, datos[k])).join("") + `</details>`;
  }
  return html + `</div>`;
}

// ---------- Búsqueda ----------
function buscar(nombre) {
  const entrada = normalizar(nombre || document.getElementById("busqueda").value);
  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "";
  if (!entrada) return;
  const textoBuscado = nombre || document.getElementById("busqueda").value;

  const ps = Object.entries(perfiles)
    .map(([c, p]) => [c, p, puntaje(c, p, entrada)]).filter(x => x[2] !== null)
    .sort((a, b) => a[2] - b[2]);
  const coincidencias = Object.entries(datos)
    .map(([clave, info]) => [clave, info, puntaje(clave, info, entrada)])
    .filter(([, , p]) => p !== null)
    .sort((a, b) => a[2] - b[2] || a[0].length - b[0].length);

  if (ps.length || coincidencias.length) {
    resultado.innerHTML = ps.map(([c, p]) => mostrarPerfil(c, p)).join("")
      + coincidencias.map(([c, i]) => mostrar(c, i)).join("");
    registrarBusqueda(textoBuscado, true);
  } else {
    registrarBusqueda(textoBuscado, false);
    const aprox = sugerirAproximados(entrada);
    if (aprox.length > 0) {
      resultado.innerHTML = `<div class="aviso-aprox">No encontramos exactamente lo que escribiste. ¿Quisiste decir <strong>${aprox[0].termino}</strong>?</div>`
        + aprox.map(({clave, info}) => mostrar(clave, info)).join("");
    } else {
      resultado.innerHTML = "<div class='sin-resultados'>No se encontraron resultados. Consultar con el Laboratorio Central.</div>";
    }
  }
}


// ---- Búsqueda aproximada (errores de tipeo) ----
function distancia(a, b) {
  // distancia de edición que cuenta como 1 error el cambio de dos letras seguidas
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  const d = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const costo = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + costo);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[m][n];
}

function sugerirAproximados(entrada) {
  if (entrada.length < 4) return [];
  const tolerancia = entrada.length <= 5 ? 1 : 2;
  const encontrados = [];
  Object.entries(datos).forEach(([clave, info]) => {
    const terminos = [clave.replace(/ - pcr$/i, ""), ...(info.sinonimos || [])];
    let mejor = 99, mejorTermino = "";
    terminos.forEach(t => {
      const tn = normalizar(t);
      // se compara con el término completo y con cada palabra de 4 letras o más
      [tn, ...tn.split(/[\s\/\-\(\),]+/).filter(w => w.length >= 4)].forEach(c => {
        const dist = distancia(entrada, c);
        if (dist < mejor) { mejor = dist; mejorTermino = t; }
      });
    });
    if (mejor <= tolerancia) encontrados.push({clave, info, dist: mejor, termino: mejorTermino});
  });
  return encontrados.sort((a, b) => a.dist - b.dist).slice(0, 4);
}

function armarInicio() {
  const cont = document.getElementById("inicio");
  let html = `<div class="titulo-seccion" style="margin-top:6px">Determinaciones por sector</div>`;
  secciones.forEach(s => {
    html += `<details class="sec"><summary>${s.nombre}<span class="n">${s.items.length}</span></summary><div class="lista">`;
    if (s.nota) html += `<div class="sec-nota">${s.nota}</div>`;
    s.items.forEach(k => {
      const mini = datos[k].ficha ? `<span class="ficha-mini">FICHA</span>` : "";
      html += `<details class="det" data-k="${k.replace(/"/g, "&quot;")}" data-s="${s.nombre}"><summary><span>${s.nombre === "Virología - Biología Molecular" ? k.replace(/ - PCR$/, "") : k}${mini}</span></summary><div class="cuerpo"></div></details>`;
    });
    html += `</div></details>`;
  });
  cont.innerHTML = html;
  cont.addEventListener("toggle", e => {
    const d = e.target;
    if (d.classList && d.classList.contains("sec") && d.open) {
      cont.querySelectorAll("details.sec[open]").forEach(o => { if (o !== d) o.open = false; });
      d.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    if (d.classList && d.classList.contains("sec") && !d.open) {
      d.querySelectorAll("details.det[open]").forEach(o => { o.open = false; });
    }
    if (d.classList && d.classList.contains("det") && d.open) {
      cont.querySelectorAll("details.det[open]").forEach(o => { if (o !== d) o.open = false; });
      const c = d.querySelector(".cuerpo");
      if (!c.innerHTML) c.innerHTML = mostrar(d.dataset.k, datos[d.dataset.k], d.dataset.s);
    }
  }, true);
}

function vista(v) {
  ["inicio", "buscador", "sectores", "fichas", "instructivos"].forEach(x => document.getElementById("vista-" + x).classList.toggle("activa", x === v));
  window.scrollTo(0, 0);
  if (v === "buscador") document.getElementById("busqueda").focus();
}
function vistaActual() {
  const h = (location.hash || "").slice(1);
  return ["buscador", "sectores", "fichas", "instructivos"].includes(h) ? h : "inicio";
}
function ir(v) {
  if (vistaActual() === v) { vista(v); return; }
  location.hash = v === "inicio" ? "" : v;   // dispara hashchange
}

/* ---- Estadísticas (GoatCounter: sin cookies ni datos personales) ---- */
function gc(path, titulo, evento) {
  try {
    let n = 0;
    const t = setInterval(() => {
      if (window.goatcounter && window.goatcounter.count) {
        clearInterval(t);
        window.goatcounter.count({ path: path, title: titulo || path, event: !!evento });
      } else if (++n > 40) clearInterval(t);
    }, 250);
  } catch (e) {}
}
(function () {
  let lugar = new URLSearchParams(location.search).get("lugar") || "directo";
  if (!["guardia", "consultorios", "internacion", "directo"].includes(lugar)) lugar = "otro";
  gc("qr/" + lugar, "Ingreso: " + lugar, false);
})();
window.addEventListener("hashchange", () => { const v = vistaActual(); if (v !== "inicio") gc("vista/" + v, "Pantalla: " + v, true); });
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest(".btn-pdf");
  if (a && a.getAttribute("href")) gc("pdf/" + a.getAttribute("href").split("/").pop().replace(".pdf", ""), "PDF: " + a.getAttribute("href").split("/").pop(), true);
});
let _ultimaBusq = "";
function registrarBusqueda(t, encontrado) {
  t = (t || "").trim().toLowerCase().slice(0, 40);
  const clave = (encontrado ? "1" : "0") + t;
  if (t && clave !== _ultimaBusq) {
    _ultimaBusq = clave;
    gc((encontrado ? "busqueda/" : "sinres/") + t, (encontrado ? "Búsqueda: " : "Sin resultado: ") + t, true);
  }
}

function limpiar() {
  document.getElementById("busqueda").value = "";
  document.getElementById("resultado").innerHTML = "";
}
document.getElementById("busqueda").addEventListener("keydown", e => { if (e.key === "Enter") buscar(); });
document.getElementById("busqueda").addEventListener("input", e => { if (!e.target.value.trim()) limpiar(); });
